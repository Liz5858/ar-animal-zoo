<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 교실 공룡 연구소</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f4ef;color:#193c32;font-family:system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}h1{font-size:30px;margin:6px 0}p{line-height:1.7;color:#597267}small{letter-spacing:2px;font-weight:700}button{cursor:pointer;border:1px solid #ccd9ce;background:#fff;color:#234b3b;border-radius:12px;padding:12px 16px;font:inherit}button:hover{background:#e8f3df}button:disabled{opacity:.5;cursor:wait}.primary{background:#24573e;color:white}.layout{display:grid;grid-template-columns:1fr 280px;gap:20px}.stage{position:relative;aspect-ratio:16/10;min-height:360px;border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#e8f2cf,#bed5aa 65%,#92ad89)}video,canvas{position:absolute;width:100%;height:100%;inset:0;object-fit:cover}video{transform:scaleX(-1)}canvas{touch-action:none}.badge,#status{position:absolute;pointer-events:none;left:18px;padding:10px 14px;border-radius:12px;background:#ffffffdf;max-width:calc(100% - 36px)}.badge{top:18px;font-size:13px}#status{bottom:18px;font-size:14px}.panel{background:white;padding:22px;border-radius:22px}h2{font-size:19px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0 24px}label{display:block;font-size:14px;margin-top:18px}input{width:100%;accent-color:#377c47}.help{font-size:13px}.footer{display:flex;gap:10px;margin-top:12px}.error{background:#fff2d6!important;color:#6d4216!important}a{color:#377648}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#dce8dbe8;text-align:center;padding:30px;pointer-events:none}#loading[hidden]{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.stage{min-height:300px}header{align-items:flex-start}h1{font-size:24px}main{padding:14px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><main><header><div><small>CLASSROOM · DINOSAUR LAB</small><h1>🦖 우리 교실 공룡 연구소</h1><p style="margin:0">티라노사우루스 한 마리와 천천히 만나 보세요.</p></div><button id="cameraBtn" class="primary">카메라 켜기</button></header><div class="layout"><section><div class="stage" id="stage"><video id="video" autoplay muted playsinline></video><canvas id="scene" aria-label="3D 공룡 관찰 화면"></canvas><div class="badge">티라노사우루스 · 입체 관찰</div><div id="status" role="status">공룡을 불러오는 중…</div><div id="loading">공룡이 오는 중입니다…</div></div><div class="footer"><button id="reset">처음 위치로</button><button id="photo">사진 저장</button></div></section><aside class="panel"><h2>살아 움직이는 공룡</h2><p class="help">빈 곳을 클릭하면 그곳까지 걸어가요.<br>공룡을 클릭하면 몸을 움직이며 반응해요.</p><div class="grid"><button id="idle">쉬기</button><button id="walk">산책하기</button><button id="react">반응 보기</button><button id="turn">반대쪽 보기</button></div><label for="angle">관찰 방향 <span id="angleValue">35°</span></label><input id="angle" type="range" min="-180" max="180" value="35"><label for="size">공룡 크기 <span id="sizeValue">100%</span></label><input id="size" type="range" min="50" max="170" value="100"><label for="speed">걸음 속도</label><input id="speed" type="range" min="50" max="150" value="85"><p class="help">마우스 휠로 크기를 바꿀 수 있어요.<br>카메라 없이도 관찰할 수 있습니다.</p><hr style="border:0;border-top:1px solid #e3eadf;margin:24px 0"><p class="help">카메라를 고정하고 사용하세요. 화면에서 지정한 위치에 합성하며, 실제 책상 표면을 자동으로 인식하지 않습니다.</p><p class="help">3D 모델: <a href="https://gobkit.com/freebies" target="_blank" rel="noopener">Gobkit · CC0</a></p></aside></div></main>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id),stage=$('stage'),canvas=$('scene'),video=$('video');
const status=s=>$('status').textContent=s;
let renderer,scene,camera,model,mixer,actions={},active,stream,target=null,walkMode=false,reactUntil=0,ready=false,heading=.61,scale=1;
const root=new T.Group(),visual=new T.Group();root.add(visual);root.position.set(0,-1.8,0);
function failure(message){$('loading').hidden=false;$('loading').textContent=message;$('loading').className='error';status(message)}

/* Object-space skin detail follows the rig without stretching the original palette atlas. */
function applyDinosaurSkin(mesh){
 const g=mesh.geometry;g.computeBoundingBox();const bounds=g.boundingBox,extent=bounds.getSize(new T.Vector3());
 const originals=Array.isArray(mesh.material)?mesh.material:[mesh.material];
 const mats=originals.map(original=>{
 const mat=original.clone();mat.roughness=.88;mat.metalness=0;
 mat.onBeforeCompile=shader=>{
 shader.uniforms.skinMin={value:bounds.min.clone()};shader.uniforms.skinExtent={value:extent.clone()};
 shader.vertexShader=shader.vertexShader.replace('#include <common>','#include <common>\nuniform vec3 skinMin;uniform vec3 skinExtent;varying vec3 vSkinCoord;')
 .replace('#include <begin_vertex>','#include <begin_vertex>\nvSkinCoord=(position-skinMin)/max(skinExtent,vec3(0.000001));');
 shader.fragmentShader=shader.fragmentShader.replace('#include <common>',`#include <common>
 varying vec3 vSkinCoord;
 float skinHash(vec3 p){p=fract(p*.3183099+vec3(.13,.27,.43));p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
 float skinNoise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(mix(skinHash(i),skinHash(i+vec3(1,0,0)),f.x),mix(skinHash(i+vec3(0,1,0)),skinHash(i+vec3(1,1,0)),f.x),f.y),mix(mix(skinHash(i+vec3(0,0,1)),skinHash(i+vec3(1,0,1)),f.x),mix(skinHash(i+vec3(0,1,1)),skinHash(i+vec3(1,1,1)),f.x),f.y),f.z);}
 float skinFbm(vec3 p){return .57*skinNoise(p)+.28*skinNoise(p*2.07)+.15*skinNoise(p*4.13);}
 float skinCells(vec2 p){vec2 cell=floor(p),f=fract(p);float d=1.;for(int x=-1;x<=1;x++){for(int y=-1;y<=1;y++){vec2 o=vec2(float(x),float(y));vec2 jitter=vec2(skinHash(vec3(cell+o,2.)),skinHash(vec3(cell+o,7.)));d=min(d,length(o+.25+.5*jitter-f));}}return d;}
 vec3 skinRelief(vec3 n,vec3 pos,float h){vec3 sx=dFdx(pos),sy=dFdy(pos),r1=cross(sy,n),r2=cross(n,sx);float det=dot(sx,r1);vec3 grad=sign(det)*(dFdx(h)*r1+dFdy(h)*r2);return normalize(abs(det)*n-grad);}
 `);
 shader.fragmentShader=shader.fragmentShader.replace('#include <map_fragment>',`#include <map_fragment>
 vec3 sp=vSkinCoord*vec3(1.2,3.8,1.7);
 float mottles=skinFbm(sp*5.);
 float stripe=sin(sp.y*18.+skinFbm(sp*3.)*7.+sp.z*2.);
 float bands=smoothstep(.15,.75,stripe)*smoothstep(.22,.6,vSkinCoord.z);
 float belly=1.-smoothstep(.12,.48,vSkinCoord.z+skinNoise(sp*8.)*.12);
 float originalLuma=dot(diffuseColor.rgb,vec3(.2126,.7152,.0722));
 float skinMask=smoothstep(.018,.07,originalLuma)*(1.-smoothstep(.72,.95,originalLuma));
 vec3 skinColor=mix(vec3(.065,.083,.039),vec3(.23,.25,.105),mottles);
 skinColor=mix(skinColor,vec3(.028,.042,.023),bands*.68);
 skinColor=mix(skinColor,vec3(.29,.265,.15),belly*.7);
 float scales=skinCells(sp.yz*65.+vec2(skinNoise(sp*7.)*.5));
 float scaleRidge=smoothstep(.27,.48,scales);
 float pores=skinNoise(sp*260.);
 skinColor*=.83+.2*pores+.14*(1.-scaleRidge);
 diffuseColor.rgb=mix(diffuseColor.rgb,skinColor,skinMask);
 `);
 shader.fragmentShader=shader.fragmentShader.replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
 float skinHeight=((1.-scaleRidge)*.009+pores*.002+sin(sp.y*155.+mottles*9.)*.001)*skinMask;
 normal=skinRelief(normal,-vViewPosition,skinHeight);
 `);
 };mat.customProgramCacheKey=()=> 'dinosaur-organic-skin-v1';return mat;
 });mesh.material=Array.isArray(mesh.material)?mats:mats[0];
}

async function init(){try{
 renderer=new T.WebGLRenderer({canvas,alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
 scene=new T.Scene();camera=new T.OrthographicCamera(-8,8,5,-5,.1,100);camera.position.set(0,3,18);camera.lookAt(0,0,0);scene.add(new T.HemisphereLight(0xf8ffe9,0x5b6d55,2.5));const sun=new T.DirectionalLight(0xfff2d8,3);sun.position.set(-4,7,6);scene.add(sun);const rim=new T.DirectionalLight(0xffffff,1.4);rim.position.set(5,3,-4);scene.add(rim);scene.add(root);
 const shadowCanvas=document.createElement('canvas');shadowCanvas.width=128;shadowCanvas.height=128;const ctx=shadowCanvas.getContext('2d'),gradient=ctx.createRadialGradient(64,64,0,64,64,64);gradient.addColorStop(0,'rgba(21,45,25,.4)');gradient.addColorStop(1,'rgba(21,45,25,0)');ctx.fillStyle=gradient;ctx.fillRect(0,0,128,128);const shadow=new T.Mesh(new T.PlaneGeometry(4,2),new T.MeshBasicMaterial({map:new T.CanvasTexture(shadowCanvas),transparent:true,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.015;root.add(shadow);
 new ResizeObserver(fit).observe(stage);fit();
 const gltf=await new GLTFLoader().loadAsync('./trex.gltf');model=gltf.scene;model.updateMatrixWorld(true);model.traverse(o=>{if(o.isMesh)applyDinosaurSkin(o);if(o.isSkinnedMesh){o.skeleton.update();o.computeBoundingBox();o.computeBoundingSphere();o.frustumCulled=false;}});const box=new T.Box3().setFromObject(model,true),s=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());const norm=3.1/s.y;model.scale.setScalar(norm);model.position.set(-center.x*norm,-box.min.y*norm,-center.z*norm);visual.add(model);visual.rotation.y=heading;
 mixer=new T.AnimationMixer(model);for(const clip of gltf.animations)actions[clip.name.toLowerCase()]=mixer.clipAction(clip);if(!actions.idle||!actions.walk)throw Error('애니메이션 누락');ready=true;$('loading').hidden=true;play('idle');status('화면의 빈 곳을 클릭하면 공룡이 걸어가요');renderer.setAnimationLoop(frame);
}catch(e){failure(renderer?'공룡 파일을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.':'3D 그래픽을 시작하지 못했어요. Chrome·Edge의 그래픽 가속 설정을 확인해 주세요.');console.error(e)}}
function fit(){if(!renderer)return;const w=stage.clientWidth,h=stage.clientHeight,a=w/h;renderer.setSize(w,h,false);camera.left=-5*a;camera.right=5*a;camera.updateProjectionMatrix()}
function play(name){const next=actions[name];if(!next||next===active)return;next.reset().setEffectiveWeight(1).play();if(active)active.crossFadeTo(next,.25,false);active=next}
function stop(){target=null;walkMode=false;reactUntil=0;if(ready)play('idle')}
function react(){if(!ready)return;stop();play('attack');reactUntil=performance.now()+actions.attack.getClip().duration*1000;status('공룡이 반응하고 있어요')}
const ray=new T.Raycaster(),plane=new T.Plane(new T.Vector3(0,0,1),0),point=new T.Vector3();
function go(e){if(!ready)return;const rect=canvas.getBoundingClientRect();ray.setFromCamera(new T.Vector2((e.clientX-rect.left)/rect.width*2-1,1-(e.clientY-rect.top)/rect.height*2),camera);if(ray.intersectObject(model,true).length){react();return}if(ray.ray.intersectPlane(plane,point)){walkMode=false;reactUntil=0;target=point.clone();target.x=T.MathUtils.clamp(target.x,camera.left+1,camera.right-1);target.y=T.MathUtils.clamp(target.y,-3.6,2.5);play('walk');status('지정한 곳으로 걷는 중…')}}
canvas.addEventListener('pointerdown',go);canvas.addEventListener('wheel',e=>{e.preventDefault();$('size').value=T.MathUtils.clamp(+$('size').value-Math.sign(e.deltaY)*5,50,170);$('size').dispatchEvent(new Event('input'))},{passive:false});
$('idle').onclick=()=>{stop();status('쉬면서 몸과 꼬리를 움직여요')};$('react').onclick=react;
$('walk').onclick=()=>{if(!ready)return;walkMode=true;reactUntil=0;target=new T.Vector3(root.position.x>0?camera.left+2:camera.right-2,root.position.y,0);play('walk');status('공룡이 산책하고 있어요. 쉬기를 누르면 멈춰요')};
$('turn').onclick=()=>{stop();heading+=Math.PI;visual.rotation.y=heading;syncAngle()};
function syncAngle(){const a=Math.round(T.MathUtils.radToDeg(Math.atan2(Math.sin(heading),Math.cos(heading))));$('angle').value=a;$('angleValue').textContent=a+'°'}
$('angle').oninput=e=>{stop();heading=T.MathUtils.degToRad(+e.target.value);visual.rotation.y=heading;syncAngle()};$('size').oninput=e=>{scale=+e.target.value/100;root.scale.setScalar(scale);$('sizeValue').textContent=e.target.value+'%'};
$('reset').onclick=()=>{stop();root.position.set(0,-1.8,0);heading=.61;visual.rotation.y=heading;$('size').value=100;$('size').dispatchEvent(new Event('input'));syncAngle();status('처음 위치로 돌아왔어요')};
let previous=0;function frame(now){const dt=Math.min((now-previous)/1000||0,.05);previous=now;if(mixer){if(active===actions.walk)active.timeScale=+$('speed').value/100;mixer.update(dt)}if(target){const delta=target.clone().sub(root.position),distance=delta.length(),speed=1.4*(+$('speed').value/100)*scale;if(distance<.07){root.position.copy(target);if(walkMode){target.x=target.x>0?camera.left+2:camera.right-2}else{target=null;play('idle');status('도착했어요. 다른 곳을 클릭해 보세요')}}else{root.position.addScaledVector(delta.normalize(),Math.min(speed*dt,distance));const desired=Math.atan2(delta.x,delta.y*.22+.05);heading+=Math.atan2(Math.sin(desired-heading),Math.cos(desired-heading))*Math.min(dt*5,1);visual.rotation.y=heading;syncAngle()}}if(reactUntil&&now>reactUntil){reactUntil=0;play('idle');status('다시 주변을 살펴봐요')}renderer.render(scene,camera)}
$('cameraBtn').onclick=async()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;$('cameraBtn').textContent='카메라 켜기';status('연습 배경으로 돌아왔어요');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},facingMode:'user'},audio:false});video.srcObject=stream;await video.play();$('cameraBtn').textContent='카메라 끄기';status('카메라 연결 완료 · 공룡을 놓을 곳을 클릭하세요')}catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;status('카메라 권한 또는 연결을 확인해 주세요. 연습 배경으로 이용할 수 있어요')}};
$('photo').onclick=()=>{if(!ready)return;renderer.render(scene,camera);const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const c=out.getContext('2d');c.fillStyle='#bed5aa';c.fillRect(0,0,out.width,out.height);if(stream&&video.videoWidth){const s=Math.max(out.width/video.videoWidth,out.height/video.videoHeight);c.save();c.translate(out.width,0);c.scale(-1,1);c.drawImage(video,(out.width-video.videoWidth*s)/2,(out.height-video.videoHeight*s)/2,video.videoWidth*s,video.videoHeight*s);c.restore()}c.drawImage(canvas,0,0);const a=document.createElement('a');a.download='우리교실-티라노사우루스.png';a.href=out.toDataURL();a.click()};window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));init();
</script></body></html>
