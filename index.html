<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 교실 AR 동물원</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#213044;background:#f3f6fb}
*{box-sizing:border-box}body{margin:0}.shell{max-width:1260px;margin:auto;padding:22px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:clamp(23px,3vw,34px);margin:0}header p{margin:6px 0;color:#65748a}
button{font:inherit;cursor:pointer;border:1px solid #dbe2ee;background:white;border-radius:13px;padding:10px 14px;color:#26364d}
button:hover{border-color:#7289d5}button:focus-visible{outline:3px solid #8aaaff}
button.primary{background:#526ce4;color:white;border:0;font-weight:700}
button.selected{background:#e7edff;border-color:#5973df;color:#334fca;font-weight:750}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}
.stage{position:relative;aspect-ratio:16/10;min-height:350px;background:#192334;border-radius:22px;overflow:hidden;isolation:isolate}
#camera,#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camera{transform:scaleX(-1);background:linear-gradient(130deg,#b9d7e9,#c7e5db)}
#scene{touch-action:none;cursor:crosshair}
.hint{position:absolute;top:15px;left:15px;right:15px;pointer-events:none;color:white;text-shadow:0 2px 8px #0009;font-weight:700}
.status{position:absolute;bottom:14px;left:14px;background:#111b2bc7;color:white;border-radius:30px;padding:8px 13px;font-size:13px;pointer-events:none}
.panel{background:white;border:1px solid #e3e9f2;border-radius:20px;padding:18px;box-shadow:0 5px 24px #2534520b}
.panel h2{font-size:17px;margin:0 0 12px}.animals{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.animal{min-height:72px;font-size:15px}.animal span{display:block;font-size:29px;margin-bottom:3px}
.group{margin-bottom:23px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.range{width:100%;accent-color:#526ce4}.help{font-size:13px;line-height:1.65;color:#64748b}
.footer{margin-top:15px;display:flex;gap:9px;flex-wrap:wrap}.footer button{flex:1}
#empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:white;text-align:center;background:#192334ad;padding:30px}
#empty.hidden{display:none}#empty strong{font-size:24px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.animals{grid-template-columns:repeat(4,1fr)}.stage{min-height:300px}}
@media(max-width:500px){.shell{padding:10px}.animals{grid-template-columns:repeat(2,1fr)}.stage{min-height:270px}}
</style>
</head>
<body>
<div class="shell">
<header><div><h1>🦕 우리 교실 AR 동물원</h1><p>카메라 화면을 클릭해서 동물을 소환해 보세요!</p></div><button class="primary" id="cameraBtn">📷 카메라 켜기</button></header>
<div class="layout">
<section>
<div class="stage" id="stage">
<video id="camera" autoplay playsinline muted></video>
<canvas id="scene" aria-label="동물을 배치하는 화면"></canvas>
<div class="hint">✨ 원하는 위치를 클릭해 보세요</div>
<div class="status" id="status">카메라를 켜거나 연습 화면에서 시작하세요</div>
<div id="empty"><div><strong>🦖 동물을 소환해 볼까요?</strong><p>카메라를 켜거나, 바로 화면을 클릭해 연습해 보세요.</p></div></div>
</div>
<div class="footer"><button id="removeBtn">↩ 선택 동물 삭제</button><button id="clearBtn">🧹 모두 지우기</button><button id="shotBtn">📸 사진 저장</button></div>
</section>
<aside class="panel">
<div class="group"><h2>1. 동물 고르기</h2><div class="animals">
<button class="animal selected" data-kind="dino"><span>🦖</span>공룡</button>
<button class="animal" data-kind="rabbit"><span>🐰</span>토끼</button>
<button class="animal" data-kind="cat"><span>🐱</span>고양이</button>
<button class="animal" data-kind="lion"><span>🦁</span>사자</button>
</div></div>
<div class="group"><h2>2. 동물 움직이기</h2><div class="buttons">
<button id="jumpBtn">⬆ 점프!</button><button id="rotateBtn">↻ 회전</button>
<button id="leftBtn">◀ 왼쪽</button><button id="rightBtn">오른쪽 ▶</button>
</div></div>
<div class="group"><h2>3. 크기 바꾸기</h2><input class="range" id="size" type="range" min="40" max="220" value="100" aria-label="선택 동물 크기"><div class="help">작게 ↔ 크게 · <span id="sizeValue">100%</span></div></div>
<div class="help">💡 화면의 빈 곳을 클릭하면 새 동물이 나타나요. 동물을 클릭하거나 드래그하면 선택·이동할 수 있어요.<br><br>카메라를 켜지 않아도 연습 화면에서 체험할 수 있습니다.</div>
</aside>
</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const stage=document.getElementById('stage'),canvas=document.getElementById('scene'),video=document.getElementById('camera');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-8,8,5,-5,.1,100);camera.position.set(0,0,25);camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x75829a,2.3));
const light=new THREE.DirectionalLight(0xffffff,2.1);light.position.set(-4,8,12);scene.add(light);
const items=[];let selected=null,kind='dino',stream=null,dragging=false,dragMoved=false,pointerStart=null;
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.78});
function ball(parent,x,y,z,sx,sy,sz,color){let o=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),mat(color));o.position.set(x,y,z);o.scale.set(sx,sy,sz);parent.add(o);return o}
function cone(parent,x,y,z,r,h,color,rot=0){let o=new THREE.Mesh(new THREE.ConeGeometry(r,h,16),mat(color));o.position.set(x,y,z);o.rotation.z=rot;parent.add(o);return o}
function animal(type){
 const root=new THREE.Group(),body=new THREE.Group();root.add(body);
 const palette={dino:'#66c77b',rabbit:'#f2e6dd',cat:'#e5a45d',lion:'#d4a35c'};
 const c=palette[type];
 ball(body,0,.75,0,.73,.77,.52,c);ball(body,0,1.75,.06,.62,.61,.56,c);
 for(let x of [-.43,.43]){ball(body,x,.18,.14,.23,.35,.25,c);ball(body,x,1.84,.57,.095,.13,.07,'#252d40')}
 ball(body,0,1.55,.62,.17,.13,.10,type==='dino'?'#418f58':'#ad7778');
 if(type==='dino'){
 for(let i=0;i<4;i++)cone(body,0,1.38-i*.34,-.45,.22,.43,'#3b9a62');
 let tail=cone(body,0,.45,-.65,.42,1.25,c);tail.rotation.x=-Math.PI/2.7;
 for(let x of [-.65,.65])ball(body,x,.9,.25,.22,.26,.25,c);
 }else if(type==='rabbit'){
 for(let x of [-.35,.35]){ball(body,x,2.57,0,.22,.78,.19,c);ball(body,x,2.61,.17,.11,.55,.08,'#e6b1b6')}
 ball(body,0,.42,-.57,.23,.23,.23,'#ffffff');
 }else if(type==='cat'){
 for(let x of [-.45,.45])cone(body,x,2.34,0,.31,.57,c);
 const tail=ball(body,.83,.63,-.28,.18,.6,.18,c);tail.rotation.z=-.65;
 for(let x of [-1,1]){let whisk=ball(body,x*.35,1.52,.6,.28,.018,.018,'#eee');whisk.rotation.z=x*.16}
 }else{
 ball(body,0,1.67,-.14,.83,.82,.46,'#a96b32');ball(body,0,1.78,.29,.60,.59,.43,c);
 for(let x of [-.36,.36])ball(body,x,2.23,.10,.22,.22,.20,'#a96b32');
 ball(body,.84,.55,-.28,.18,.56,.17,c);
 }
 const shadow=new THREE.Mesh(new THREE.CircleGeometry(.87,32),new THREE.MeshBasicMaterial({color:0x172331,transparent:true,opacity:.25,depthWrite:false}));
 shadow.rotation.x=0;shadow.scale.y=.30;shadow.position.y=-.18;root.add(shadow);
 body.position.y=-.75;root.userData={body,shadow,baseY:0,jumpAt:0,turnAt:0,turnFrom:0};
 return root;
}
function fit(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);let aspect=w/h;camera.left=-5*aspect;camera.right=5*aspect;camera.top=5;camera.bottom=-5;camera.updateProjectionMatrix()}
new ResizeObserver(fit).observe(stage);fit();
function coords(e){let r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*2-1,y:-((e.clientY-r.top)/r.height*2-1)}}
function world(e){const p=coords(e);return new THREE.Vector3(p.x*(camera.right-camera.left)/2,p.y*5,0)}
function hit(e){const p=world(e);for(let i=items.length-1;i>=0;i--){let o=items[i];let dx=p.x-o.position.x,dy=p.y-o.position.y;let s=o.scale.x;if(Math.abs(dx)<.85*s&&dy>-.6*s&&dy<2.2*s)return o}return null}
function choose(o){selected=o;document.getElementById('size').value=Math.round((o?.scale.x||1)*100);document.getElementById('sizeValue').textContent=document.getElementById('size').value+'%';status(o?'동물 선택됨 · 드래그해서 움직여 보세요':'빈 곳을 클릭해 동물을 소환하세요')}
function status(s){document.getElementById('status').textContent=s}
function spawn(e){const p=world(e),o=animal(kind);o.position.set(p.x,p.y,0);scene.add(o);items.push(o);choose(o);document.getElementById('empty').classList.add('hidden')}
canvas.addEventListener('pointerdown',e=>{pointerStart={x:e.clientX,y:e.clientY};dragMoved=false;const o=hit(e);if(o){choose(o);dragging=true;canvas.setPointerCapture(e.pointerId)}else{spawn(e)}});
canvas.addEventListener('pointermove',e=>{if(!dragging||!selected)return;const p=world(e);selected.position.x=p.x;selected.position.y=p.y;if(pointerStart&&Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y)>5)dragMoved=true});
canvas.addEventListener('pointerup',()=>dragging=false);
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('selected',x===b));status(b.textContent.trim()+' 선택 · 화면을 클릭하세요')});
document.getElementById('jumpBtn').onclick=()=>{if(selected)selected.userData.jumpAt=performance.now();else status('먼저 동물을 소환하세요')};
document.getElementById('rotateBtn').onclick=()=>{if(selected){selected.userData.turnAt=performance.now();selected.userData.turnFrom=selected.userData.body.rotation.y}else status('먼저 동물을 소환하세요')};
document.getElementById('leftBtn').onclick=()=>{if(selected)selected.rotation.y-=.35};
document.getElementById('rightBtn').onclick=()=>{if(selected)selected.rotation.y+=.35};
document.getElementById('size').oninput=e=>{document.getElementById('sizeValue').textContent=e.target.value+'%';if(selected)selected.scale.setScalar(+e.target.value/100)};
function remove(o){if(!o)return;scene.remove(o);items.splice(items.indexOf(o),1);choose(items.at(-1)||null)}
document.getElementById('removeBtn').onclick=()=>remove(selected);
document.getElementById('clearBtn').onclick=()=>{for(const o of [...items])remove(o);status('모두 지웠어요. 새 동물을 소환해 보세요')};
document.getElementById('cameraBtn').onclick=async()=>{
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;document.getElementById('cameraBtn').textContent='📷 카메라 켜기';status('연습 화면 모드');return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280}},audio:false});video.srcObject=stream;await video.play();document.getElementById('cameraBtn').textContent='⏹ 카메라 끄기';document.getElementById('empty').classList.add('hidden');status('카메라 연결 완료 · 원하는 곳을 클릭하세요')}
 catch(err){status('카메라를 사용할 수 없어요. HTTPS·권한을 확인하세요.');alert('카메라를 열지 못했어요. HTTPS 주소에서 실행하고 카메라 권한을 허용해 주세요.')}
};
document.getElementById('shotBtn').onclick=()=>{
 const out=document.createElement('canvas');out.width=stage.clientWidth*2;out.height=stage.clientHeight*2;
 const ctx=out.getContext('2d');ctx.fillStyle='#c8d8e9';ctx.fillRect(0,0,out.width,out.height);
 if(stream&&video.videoWidth){ctx.save();ctx.translate(out.width,0);ctx.scale(-1,1);let vw=video.videoWidth,vh=video.videoHeight,scale=Math.max(out.width/vw,out.height/vh);ctx.drawImage(video,(out.width-vw*scale)/2,(out.height-vh*scale)/2,vw*scale,vh*scale);ctx.restore()}
 ctx.drawImage(canvas,0,0,out.width,out.height);const a=document.createElement('a');a.download='우리교실-AR동물원.png';a.href=out.toDataURL('image/png');a.click();status('사진을 저장했어요!')
};
function animate(t){requestAnimationFrame(animate);for(let o of items){const d=o.userData;let elapsed=(t-d.jumpAt)/850;if(d.jumpAt&&elapsed>=0&&elapsed<1){d.body.position.y=-.75+Math.sin(elapsed*Math.PI)*1.15}else d.body.position.y=-.75;
 let r=(t-d.turnAt)/950;if(d.turnAt&&r>=0&&r<1)d.body.rotation.y=d.turnFrom+Math.PI*2*r;else if(d.turnAt&&r>=1){d.body.rotation.y=d.turnFrom;d.turnAt=0}
 }renderer.render(scene,camera)}
requestAnimationFrame(animate);
</script>
</body></html>
